services:
  opencode-ai:
    build:
      context: .
    image: ${OPENCODE_IMAGE_NAME:-opencode-ai:latest}
    container_name: ${OPENCODE_CONTAINER_NAME:-opencode_container}
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-opencode}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
    volumes:
      - ${OPENCODE_CONFIG_HOST_PATH:-./data/config}:/home/ubuntu/.config/opencode
      - ${OPENCODE_DATA_HOST_PATH:-./data/local}:/home/ubuntu/.local/share/opencode
      - ${OPENCODE_WORKSPACE_HOST_PATH:-./data/workspace}:/workspace
    working_dir: /workspace
    ports:
      - "${OPENCODE_SERVER_HOST:-127.0.0.1}:${OPENCODE_SERVER_PORT:-4096}:4096"
    command:
      - bash
      - -lc
      - |
        cd /workspace && \
        exec opencode web --port 4096 --hostname 0.0.0.0
